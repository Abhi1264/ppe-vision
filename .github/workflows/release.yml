name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: apk, os: ubuntu-latest }
          - { target: linux, os: ubuntu-latest }
          - { target: macos, os: macos-latest }
          - { target: windows, os: windows-latest }
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Write Android signing key
        if: matrix.target == 'apk'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See Releases in README.md."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Build
        run: |
          flutter build ${{ matrix.target }} --release \
            --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER"

      - name: Package
        run: |
          mkdir -p ../dist
          name="ppe-vision-$GITHUB_REF_NAME"
          case "${{ matrix.target }}" in
            apk) cp build/app/outputs/flutter-apk/app-release.apk "../dist/$name-android.apk" ;;
            linux) tar -czf "../dist/$name-linux-x64.tar.gz" -C build/linux/x64/release bundle ;;
            macos) ditto -c -k --keepParent "build/macos/Build/Products/Release/PPE Vision.app" "../dist/$name-macos.zip" ;;
            windows) 7z a "../dist/$name-windows-x64.zip" ./build/windows/x64/runner/Release/* ;;
          esac

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
