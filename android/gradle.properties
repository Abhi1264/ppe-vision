org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
org.gradle.caching=true
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
android.useAndroidX=true
# Keep the legacy AGP DSL until Flutter finishes migrating (https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin).
android.newDsl=false
# AGP 9+ default. Requires Flutter 3.47+ and no kotlin-android plugin (https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers).
android.builtInKotlin=true
